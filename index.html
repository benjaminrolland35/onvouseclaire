function buildScene(src) {
  const W = window.innerWidth, H = window.innerHeight;
  const secret = document.createElement('span');
  secret.id = 'secret';
  secret.style.left = (80 + Math.random() * (W - 200)) + 'px';
  secret.style.top  = (80 + Math.random() * (H - 200)) + 'px';
  secret.textContent = 'clique-ici';
  secret.addEventListener('click', () => { const w = window.open(); w.opener = null; w.location = INSTA_URL; });
  document.getElementById('scene').appendChild(secret);
  const step = 38, cols = Math.ceil(W / step) + 6, rows = Math.ceil(H / step) + 6;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const size = 70 + Math.random() * 220;
    const x = c * step - step * 2 + (Math.random() - 0.5) * step * 1.2;
    const y = r * step - step * 2 + (Math.random() - 0.5) * step * 1.2;
    const rot = Math.random() * 360;
    const div = document.createElement('div');
    div.className = 'mad';
    div.style.cssText = 'width:'+size+'px;height:'+size+'px;left:'+x+'px;top:'+y+'px;transform:rotate('+rot+'deg)';
    const img = document.createElement('img');
    img.src = src; img.draggable = false;
    div.appendChild(img);
    document.getElementById('scene').appendChild(div);
    makeDraggable(div);
  }
}

document.addEventListener('selectstart', e => e.preventDefault());

function makeDraggable(el) {
  let on = false;
  const half = () => el.offsetWidth / 2;
  el.addEventListener('mousedown', e => { on = true; el.classList.add('dragging'); document.body.classList.add('dragging-active'); e.preventDefault(); });
  el.addEventListener('touchstart', e => { on = true; el.classList.add('dragging'); e.preventDefault(); }, { passive: false });
  window.addEventListener('mousemove', e => { if (!on) return; e.preventDefault(); el.style.left = (e.clientX - half()) + 'px'; el.style.top = (e.clientY - half()) + 'px'; });
  window.addEventListener('touchmove', e => { if (!on) return; el.style.left = (e.touches[0].clientX - half()) + 'px'; el.style.top = (e.touches[0].clientY - half()) + 'px'; }, { passive: false });
  const stop = () => { on = false; el.classList.remove('dragging'); document.body.classList.remove('dragging-active'); };
  window.addEventListener('mouseup', stop);
  window.addEventListener('touchend', stop);
}
</script>
</body>
</html>
